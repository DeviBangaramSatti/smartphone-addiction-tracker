[versions]
agp                 = "8.2.2"
kotlin              = "1.9.22"
hilt                = "2.50"
googleServices      = "4.4.0"
coreKtx             = "1.12.0"
appcompat           = "1.6.1"
material            = "1.11.0"
lifecycle           = "2.7.0"
navigation          = "2.7.6"
room                = "2.6.1"
work                = "2.9.0"
hiltWork            = "1.1.0"
firebaseBom         = "32.7.0"
retrofit            = "2.9.0"
okhttp              = "4.12.0"
mpChart             = "v3.1.0"
glide               = "4.16.0"
coroutines          = "1.7.3"

[libraries]
# AndroidX
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                   version.ref = "coreKtx"    }
androidx-appcompat          = { group = "androidx.appcompat",        name = "appcompat",                  version.ref = "appcompat"  }
androidx-lifecycle-vm       = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycle"  }
androidx-lifecycle-ld       = { group = "androidx.lifecycle",        name = "lifecycle-livedata-ktx",     version.ref = "lifecycle"  }
androidx-navigation-frag    = { group = "androidx.navigation",       name = "navigation-fragment-ktx",    version.ref = "navigation" }
androidx-navigation-ui      = { group = "androidx.navigation",       name = "navigation-ui-ktx",          version.ref = "navigation" }
androidx-work               = { group = "androidx.work",             name = "work-runtime-ktx",           version.ref = "work"       }
# Room
room-runtime                = { group = "androidx.room",             name = "room-runtime",               version.ref = "room"       }
room-ktx                    = { group = "androidx.room",             name = "room-ktx",                   version.ref = "room"       }
room-compiler               = { group = "androidx.room",             name = "room-compiler",              version.ref = "room"       }
# Material
material                    = { group = "com.google.android.material", name = "material",                 version.ref = "material"   }
# Hilt
hilt-android                = { group = "com.google.dagger",         name = "hilt-android",               version.ref = "hilt"       }
hilt-compiler               = { group = "com.google.dagger",         name = "hilt-compiler",              version.ref = "hilt"       }
hilt-work                   = { group = "androidx.hilt",             name = "hilt-work",                  version.ref = "hiltWork"   }
hilt-work-compiler          = { group = "androidx.hilt",             name = "hilt-compiler",              version.ref = "hiltWork"   }
# Firebase
firebase-bom                = { group = "com.google.firebase",       name = "firebase-bom",               version.ref = "firebaseBom"}
firebase-auth               = { group = "com.google.firebase",       name = "firebase-auth-ktx"                                      }
firebase-firestore          = { group = "com.google.firebase",       name = "firebase-firestore-ktx"                                 }
# Retrofit / OkHttp
retrofit                    = { group = "com.squareup.retrofit2",    name = "retrofit",                   version.ref = "retrofit"   }
retrofit-gson               = { group = "com.squareup.retrofit2",    name = "converter-gson",             version.ref = "retrofit"   }
okhttp-logging              = { group = "com.squareup.okhttp3",      name = "logging-interceptor",        version.ref = "okhttp"     }
# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Charts
mpchart                     = { group = "com.github.PhilJay",        name = "MPAndroidChart",             version.ref = "mpChart"    }
# Glide
glide                       = { group = "com.github.bumptech.glide", name = "glide",                      version.ref = "glide"      }

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp"          }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin"       }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt",          version.ref = "kotlin"       }
hilt-android        = { id = "com.google.dagger.hilt.android",     version.ref = "hilt"         }
google-services     = { id = "com.google.gms.google-services",     version.ref = "googleServices"}
